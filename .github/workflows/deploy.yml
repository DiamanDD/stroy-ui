name: Deploy stroy-ui

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          set -euo pipefail
          missing=()
          [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] && missing+=("SSH_PRIVATE_KEY")
          [ -z "${{ secrets.SSH_HOST }}" ] && missing+=("SSH_HOST")
          [ -z "${{ secrets.SSH_USER }}" ] && missing+=("SSH_USER")
          [ -z "${{ secrets.VITE_MAX_URL }}" ] && missing+=("VITE_MAX_URL")
          [ -z "${{ secrets.YOUGILE_TOKEN }}" ] && missing+=("YOUGILE_TOKEN")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Normalize SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          host="$(trim "${SSH_HOST}")"
          user="$(trim "${SSH_USER}")"
          host="${host#ssh://}"
          host="${host#https://}"
          host="${host#http://}"
          if [[ "$host" == *@* ]]; then
            user="${host%@*}"
            host="${host##*@}"
          fi
          ssh_port=22
          if [[ "$host" == \[*\]:* ]]; then
            ssh_port="${host##*:}"
            host="${host%:*}"
            host="${host#[}"
            host="${host%]}"
          elif [[ "$host" =~ ^[0-9.]+(:[0-9]+)?$ || "$host" =~ ^[A-Za-z0-9.-]+(:[0-9]+)?$ ]]; then
            if [[ "$host" == *:* ]]; then
              ssh_port="${host##*:}"
              host="${host%:*}"
            fi
          fi
          if [[ "$host" =~ [^A-Za-z0-9.:_-] ]]; then
            echo "SSH_HOST has invalid characters after cleanup (length=${#host})."
            echo "Set the secret to an IP or hostname only, without quotes, user@, or a trailing newline."
            exit 1
          fi
          {
            echo "SSH_HOST=${host}"
            echo "SSH_USER=${user}"
            echo "SSH_PORT=${ssh_port}"
          } >> "$GITHUB_ENV"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to server
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/stroy-ui}"
          TARGET="${SSH_USER}@${SSH_HOST}"

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${TARGET}" \
            "mkdir -p '${DEPLOY_PATH}'"

          tar czf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.idea' \
            --exclude='./node_modules' \
            --exclude='./dist' \
            --exclude='./.env' \
            --exclude='./.docker' \
            --exclude='./.cache' \
            --exclude='./certs' \
            --exclude='./certbot' \
            . | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${TARGET}" \
            "tar xzf - -C '${DEPLOY_PATH}'"

      - name: Build and start containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          YOUGILE_TOKEN: ${{ secrets.YOUGILE_TOKEN }}
          YOUGILE_COLUMN_ID: ${{ secrets.YOUGILE_COLUMN_ID }}
          SSL_DOMAIN: ${{ secrets.SSL_DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          port: ${{ env.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: YOUGILE_TOKEN,YOUGILE_COLUMN_ID,SSL_DOMAIN,CERTBOT_EMAIL
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH != '' && secrets.DEPLOY_PATH || '/opt/stroy-ui' }}"
            cd "$DEPLOY_PATH"
            export DOCKER_CONFIG="${DEPLOY_PATH}/.docker"
            export XDG_CACHE_HOME="${DEPLOY_PATH}/.cache"
            mkdir -p "$DOCKER_CONFIG" "$XDG_CACHE_HOME"
            export VITE_MAX_URL="${{ secrets.VITE_MAX_URL }}"
            export YOUGILE_TOKEN
            export YOUGILE_COLUMN_ID="${YOUGILE_COLUMN_ID:-d8a00f44-9db9-4109-ae5e-b645a5d845bd}"
            export SSL_DOMAIN="${SSL_DOMAIN:-}"
            export CERTBOT_EMAIL="${CERTBOT_EMAIL:-}"
            HOST="$(printf '%s' "${{ env.SSH_HOST }}" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -z "${HOST}" ]; then
              HOST="localhost"
            fi
            chmod +x scripts/generate-self-signed-cert.sh scripts/setup-ssl.sh scripts/certbot-deploy-hook.sh
            echo ">>> prepare fallback certificate"
            ./scripts/setup-ssl.sh "${HOST}"
            echo ">>> docker compose down"
            docker compose down --remove-orphans || true
            echo ">>> docker compose build"
            docker compose build --pull
            echo ">>> docker compose up"
            docker compose up -d --remove-orphans --force-recreate
            echo ">>> setup trusted certificate if configured"
            ./scripts/setup-ssl.sh "${HOST}"
            echo ">>> nginx config test"
            docker compose exec -T app nginx -t
            echo ">>> deploy done"
