services:
  api:
    image: stroy-ui-api
    container_name: stroy-ui-api
    restart: unless-stopped
    build:
      context: ./api
    environment:
      YOUGILE_TOKEN: ${YOUGILE_TOKEN}
      YOUGILE_COLUMN_ID: ${YOUGILE_COLUMN_ID:-d8a00f44-9db9-4109-ae5e-b645a5d845bd}
      YOUGILE_API_URL: ${YOUGILE_API_URL:-https://yougile.com/api-v2}
    expose:
      - '3001'

  app:
    image: stroy-ui
    container_name: stroy-ui
    restart: unless-stopped
    depends_on:
      - api
    build:
      context: .
      args:
        VITE_MAX_URL: ${VITE_MAX_URL}
    environment:
      SSL_DOMAIN: ${SSL_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '3000:443'
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

  certbot-renew:
    image: certbot/certbot:latest
    container_name: stroy-ui-certbot
    restart: unless-stopped
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache docker-cli >/dev/null
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet \
            --deploy-hook "docker exec stroy-ui nginx -s reload"
          sleep 12h & wait $$!
        done
